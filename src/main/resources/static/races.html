<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Races</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #e8e8e8; }
        h2 { color: #e10600; }
        .table { color: #e8e8e8; }
        .btn-f1 { background: #e10600; border: none; color: #fff; }
        .btn-f1:hover { background: #9a0400; color: #fff; }
        .form-control { background: #1a1a1a; color: #e8e8e8; border-color: #333; }
        .form-control:focus { background: #1a1a1a; color: #e8e8e8; border-color: #e10600; box-shadow: none; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#111; border-bottom:2px solid #e10600;">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" style="color:#e10600;" href="index.html">🏎 F1Stats</a>
        <span class="text-muted">Races</span>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>F1 Races</h2>
        <button class="btn btn-f1" data-bs-toggle="modal" data-bs-target="#raceModal" onclick="openAddModal()">
            + Add Race
        </button>
    </div>

    <div class="mb-3" style="max-width:360px;">
        <input type="text" id="searchInput" class="form-control"
               placeholder="Search by Grand Prix name..." oninput="searchRaces()" />
    </div>

    <div id="loadingSpinner" class="text-center my-3" style="display:none;">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-bordered table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Grand Prix</th>
                <th>Circuit</th>
                <th>Country</th>
                <th>Date</th>
                <th>Season</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="racesTableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="raceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="modalTitle">Add Race</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="raceId" />
                <div class="mb-3">
                    <label class="form-label">Grand Prix Name</label>
                    <input type="text" id="grandPrixName" class="form-control" placeholder="e.g. Bahrain Grand Prix" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Circuit</label>
                    <input type="text" id="circuit" class="form-control" placeholder="e.g. Bahrain International Circuit" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Country</label>
                    <input type="text" id="country" class="form-control" placeholder="e.g. Bahrain" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Race Date</label>
                    <input type="date" id="raceDate" class="form-control" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Season</label>
                    <input type="number" id="season" class="form-control" min="1950" placeholder="e.g. 2025" />
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-f1" onclick="saveRace()">Save</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api/races';
    let allRaces = [];

    $(document).ready(function() {
        getAllRaces();
    });

    function showToast(msg, isSuccess) {
        const toastEl = document.getElementById('toast');
        toastEl.classList.remove('bg-success', 'bg-danger');
        toastEl.classList.add(isSuccess ? 'bg-success' : 'bg-danger');
        document.getElementById('toastMsg').textContent = msg;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    function getAllRaces() {
        showLoading(true);
        $.ajax({
            url: API,
            type: 'GET',
            dataType: 'json',
            success: function(response) {
                showLoading(false);
                allRaces = response;
                buildTable(response);
            },
            error: function() {
                showLoading(false);
                showToast('Failed to load races', false);
            }
        });
    }

    function buildTable(races) {
        let tbl_body = '';
        if (!races || races.length === 0) {
            tbl_body = '<tr><td colspan="7" class="text-center text-muted">No races found</td></tr>';
        } else {
            $.each(races, function(index, r) {
                tbl_body +=
                    '<tr>' +
                    '<td>' + (r.id ?? '') + '</td>' +
                    '<td>' + (r.grandPrixName ?? '') + '</td>' +
                    '<td>' + (r.circuit ?? '') + '</td>' +
                    '<td>' + (r.country ?? '') + '</td>' +
                    '<td>' + (r.raceDate ?? '') + '</td>' +
                    '<td>' + (r.season ?? '') + '</td>' +
                    '<td>' +
                    '<button class="btn btn-sm btn-outline-light me-1" onclick="openEditModal(' + r.id + ')">Edit</button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteRace(' + r.id + ')">Delete</button>' +
                    '</td>' +
                    '</tr>';
            });
        }
        $('#racesTableBody').html(tbl_body);
    }

    function searchRaces() {
        const query = $('#searchInput').val().toLowerCase().trim();
        if (query === '') {
            buildTable(allRaces);
            return;
        }
        const filtered = allRaces.filter(r =>
            (r.grandPrixName || '').toLowerCase().includes(query)
        );
        buildTable(filtered);
    }

    function openAddModal() {
        $('#modalTitle').text('Add Race');
        $('#raceId').val('');
        $('#grandPrixName').val('');
        $('#circuit').val('');
        $('#country').val('');
        $('#raceDate').val('');
        $('#season').val('');
    }

    function openEditModal(id) {
        $.ajax({
            url: API + '/' + id,
            type: 'GET',
            dataType: 'json',
            success: function(r) {
                $('#modalTitle').text('Edit Race');
                $('#raceId').val(r.id);
                $('#grandPrixName').val(r.grandPrixName);
                $('#circuit').val(r.circuit);
                $('#country').val(r.country);
                $('#raceDate').val(r.raceDate);
                $('#season').val(r.season);
                const modal = new bootstrap.Modal(document.getElementById('raceModal'));
                modal.show();
            },
            error: function() {
                showToast('Failed to load race', false);
            }
        });
    }

    function saveRace() {
        const id = $('#raceId').val();
        const body = {
            grandPrixName: $('#grandPrixName').val(),
            circuit: $('#circuit').val(),
            country: $('#country').val(),
            raceDate: $('#raceDate').val(),
            season: parseInt($('#season').val()) || 0
        };

        $.ajax({
            url: id ? API + '/' + id : API,
            type: id ? 'PUT' : 'POST',
            contentType: 'application/json',
            data: JSON.stringify(body),
            success: function() {
                bootstrap.Modal.getInstance(document.getElementById('raceModal')).hide();
                getAllRaces();
                showToast(id ? 'Race updated successfully!' : 'Race added successfully!', true);
            },
            error: function() {
                showToast('Save failed', false);
            }
        });
    }

    function deleteRace(id) {
        if (!confirm('Are you sure you want to delete this race?')) return;
        $.ajax({
            url: API + '/' + id,
            type: 'DELETE',
            success: function() {
                getAllRaces();
                showToast('Race deleted successfully!', true);
            },
            error: function() {
                showToast('Delete failed', false);
            }
        });
    }
</script>
</body>
</html>
