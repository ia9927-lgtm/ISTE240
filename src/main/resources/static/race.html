<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Races</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="races.css">
</head>
<body>

<div class="container 1">

    <h1 class="formula-main">Formula 1 Races</h1>

    <div class="add/update-race-form">
        <h4>Add / Update Race</h4>

        <input type="hidden" id="raceId">

        <input class="form-control" id="grandPrixName" placeholder="Grand Prix Name">
        <input class="form-control" id="circuit" placeholder="Circuit">
        <input class="form-control" id="country" placeholder="Country">
        <input class="form-control" id="raceDate" placeholder="Race Date">
        <input class="form-control" id="season" type="number" placeholder="Season">

        <button class="btn-primary" onclick="saveRace()">Save Race</button>
        <button class="btn-secondary" onclick="clearForm()">Clear</button>
    </div>

    <div class="container search-race-form">
        <div class="form inline">
            <input class="form-control" id="searchInput" placeholder="Search by Grand Prix Name">
            <button class="btn-success" onclick="searchRace()">Search</button>
            <button class="btn-outline-secondary " onclick="loadRaces()">Show All</button>
        </div>

        <table class="table">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Grand Prix</th>
                <th>Circuit</th>
                <th>Country</th>
                <th>Date</th>
                <th>Season</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="raceTable"></tbody>
        </table>
    </div>

</div>

<script src="races.js"></script>
</body>
</html>
