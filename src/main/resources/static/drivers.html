<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Drivers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #e8e8e8; }
        h2 { color: #e10600; }
        .table { color: #e8e8e8; }
        .btn-f1 { background: #e10600; border: none; color: #fff; }
        .btn-f1:hover { background: #9a0400; color: #fff; }
        .form-control { background: #1a1a1a; color: #e8e8e8; border-color: #333; }
        .form-control:focus { background: #1a1a1a; color: #e8e8e8; border-color: #e10600; box-shadow: none; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#111; border-bottom:2px solid #e10600;">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" style="color:#e10600;" href="index.html">🏎 F1Stats</a>
        <span class="text-muted">Drivers</span>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>F1 Drivers</h2>
        <button class="btn btn-f1" data-bs-toggle="modal" data-bs-target="#driverModal" onclick="openAddModal()">
            + Add Driver
        </button>
    </div>

    <!-- Search bar -->
    <div class="mb-3" style="max-width:320px;">
        <input type="text" id="searchInput" class="form-control"
               placeholder="Search by nationality..." oninput="searchDrivers()" />
    </div>

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="text-center my-3" style="display:none;">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-dark table-bordered table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Nationality</th>
                <th>Driver Number</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="driversTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="driverModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="modalTitle">Add Driver</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="driverId" />
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" id="driverFirstName" class="form-control" placeholder="e.g. Lewis" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" id="driverLastName" class="form-control" placeholder="e.g. Hamilton" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Nationality</label>
                    <input type="text" id="driverNationality" class="form-control" placeholder="e.g. British" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Driver Number</label>
                    <input type="number" id="driverNumber" class="form-control" min="1" placeholder="e.g. 44" />
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-f1" onclick="saveDriver()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast notification -->
<div class="toast-container">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api/drivers';

    // on page load
    $(document).ready(function() {
        getAllDrivers();
    });

    // toast
    function showToast(msg, isSuccess) {
        const toastEl = document.getElementById('toast');
        toastEl.classList.remove('bg-success', 'bg-danger');
        toastEl.classList.add(isSuccess ? 'bg-success' : 'bg-danger');
        document.getElementById('toastMsg').textContent = msg;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    // loading
    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    // function A: gets all drivers from the API
    function getAllDrivers() {
        showLoading(true);
        $.ajax({
            url: API,
            type: 'GET',
            dataType: 'json',
            success: function(response) {
                showLoading(false);
                buildTable(response);
            },
            error: function() {
                showLoading(false);
                showToast('Failed to load drivers', false);
            }
        });
    }

    // function B: builds the HTML table from the data
    function buildTable(drivers) {
        let tbl_body = '';
        if (drivers.length === 0) {
            tbl_body = '<tr><td colspan="6" class="text-center text-muted">No drivers found</td></tr>';
        } else {
            $.each(drivers, function(index, d) {
                tbl_body +=
                    '<tr>' +
                    '<td>' + d.id + '</td>' +
                    '<td>' + d.firstName + '</td>' +
                    '<td>' + d.lastName + '</td>' +
                    '<td>' + d.nationality + '</td>' +
                    '<td>' + d.driverNumber + '</td>' +
                    '<td>' +
                    '<button class="btn btn-sm btn-outline-light me-1" onclick="openEditModal(' + d.id + ')">Edit</button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteDriver(' + d.id + ')">Delete</button>' +
                    '</td>' +
                    '</tr>';
            });
        }
        $('#driversTableBody').html(tbl_body);
    }

    // search
    function searchDrivers() {
        const query = $('#searchInput').val();
        if (query === '') {
            getAllDrivers();
            return;
        }
        showLoading(true);
        $.ajax({
            url: API + '/search',
            type: 'GET',
            data: { nationality: query },
            dataType: 'json',
            success: function(response) {
                showLoading(false);
                buildTable(response);
            },
            error: function() {
                showLoading(false);
                showToast('Search failed', false);
            }
        });
    }

    // open add modal
    function openAddModal() {
        $('#modalTitle').text('Add Driver');
        $('#driverId').val('');
        $('#driverFirstName').val('');
        $('#driverLastName').val('');
        $('#driverNationality').val('');
        $('#driverNumber').val('');
    }

    // open edit modal
    function openEditModal(id) {
        $.ajax({
            url: API + '/' + id,
            type: 'GET',
            dataType: 'json',
            success: function(d) {
                $('#modalTitle').text('Edit Driver');
                $('#driverId').val(d.id);
                $('#driverFirstName').val(d.firstName);
                $('#driverLastName').val(d.lastName);
                $('#driverNationality').val(d.nationality);
                $('#driverNumber').val(d.driverNumber);
                const modal = new bootstrap.Modal(document.getElementById('driverModal'));
                modal.show();
            }
        });
    }

    // save (add or edit)
    function saveDriver() {
        const id = $('#driverId').val();
        const body = {
            firstName: $('#driverFirstName').val(),
            lastName: $('#driverLastName').val(),
            nationality: $('#driverNationality').val(),
            driverNumber: parseInt($('#driverNumber').val()) || 0
        };

        $.ajax({
            url: id ? API + '/' + id : API,
            type: id ? 'PUT' : 'POST',
            contentType: 'application/json',
            data: JSON.stringify(body),
            success: function() {
                bootstrap.Modal.getInstance(document.getElementById('driverModal')).hide();
                getAllDrivers();
                showToast(id ? 'Driver updated successfully!' : 'Driver added successfully!', true);
            },
            error: function() {
                showToast('Save failed', false);
            }
        });
    }

    // delete
    function deleteDriver(id) {
        if (!confirm('Are you sure you want to delete this driver?')) return;
        $.ajax({
            url: API + '/' + id,
            type: 'DELETE',
            success: function() {
                getAllDrivers();
                showToast('Driver deleted successfully!', true);
            },
            error: function() {
                showToast('Delete failed', false);
            }
        });
    }
</script>
</body>
</html>
