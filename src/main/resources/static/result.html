<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #e8e8e8; }
        h2 { color: #e10600; }
        .table { color: #e8e8e8; }
        .btn-f1 { background: #e10600; border: none; color: #fff; }
        .btn-f1:hover { background: #9a0400; color: #fff; }
        .form-control { background: #1a1a1a; color: #e8e8e8; border-color: #333; }
        .form-control:focus { background: #1a1a1a; color: #e8e8e8; border-color: #e10600; box-shadow: none; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#111; border-bottom:2px solid #e10600;">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" style="color:#e10600;" href="index.html">🏎 F1Stats</a>
        <span class="text-muted">Results</span>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>F1 Results</h2>
        <button class="btn btn-f1" data-bs-toggle="modal" data-bs-target="#resultModal" onclick="openAddModal()">
            + Add Result
        </button>
    </div>

    <div class="mb-3" style="max-width:320px;">
        <input type="text" id="searchInput" class="form-control"
               placeholder="Search by driver ID..." oninput="searchResults()" />
    </div>

    <div id="loadingSpinner" class="text-center my-3" style="display:none;">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-bordered table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Race</th>
                <th>Driver</th>
                <th>Team</th>
                <th>Position</th>
                <th>Points</th>
                <th>Fastest Lap</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="resultsTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="resultModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="modalTitle">Add Result</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="resultId" />
                <div class="mb-3">
                    <label class="form-label">Race ID</label>
                    <input type="number" id="raceId" class="form-control" placeholder="e.g. 1" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Driver ID</label>
                    <input type="number" id="driverId" class="form-control" placeholder="e.g. 1" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Finishing Position</label>
                    <input type="number" id="finishingPosition" class="form-control" min="1" placeholder="e.g. 1" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Points Earned</label>
                    <input type="number" id="pointsEarned" class="form-control" min="0" placeholder="e.g. 25" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Fastest Lap Time</label>
                    <input type="text" id="fastestLapTime" class="form-control" placeholder="e.g. 1:34.567" />
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-f1" onclick="saveResult()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api/results';

    $(document).ready(function() {
        getAllResults();
    });

    function showToast(msg, isSuccess) {
        const toastEl = document.getElementById('toast');
        toastEl.classList.remove('bg-success', 'bg-danger');
        toastEl.classList.add(isSuccess ? 'bg-success' : 'bg-danger');
        document.getElementById('toastMsg').textContent = msg;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    // ── function A: gets all results from the API ─────────────────────────────
    function getAllResults() {
        showLoading(true);
        $.ajax({
            url: API,
            type: 'GET',
            dataType: 'json',
            success: function(response) {
                showLoading(false);
                buildTable(response);
            },
            error: function() {
                showLoading(false);
                showToast('Failed to load results', false);
            }
        });
    }

    // ── function B: builds the HTML table from the data ───────────────────────
    function buildTable(results) {
        var tbl_body = '';
        if (results.length === 0) {
            tbl_body = '<tr><td colspan="8" class="text-center text-muted">No results found</td></tr>';
        } else {
            $.each(results, function(index, r) {
                var raceName = '';
                var driverName = '';
                var teamName = '';
                if (r.race) { raceName = r.race.grandPrixName; }
                if (r.driver) { driverName = r.driver.firstName + ' ' + r.driver.lastName; }
                if (r.driver && r.driver.team) { teamName = r.driver.team.name; }
                tbl_body +=
                    '<tr>' +
                    '<td>' + r.id + '</td>' +
                    '<td>' + raceName + '</td>' +
                    '<td>' + driverName + '</td>' +
                    '<td>' + teamName + '</td>' +
                    '<td>' + r.finishingPosition + '</td>' +
                    '<td>' + r.pointsEarned + '</td>' +
                    '<td>' + r.fastestLapTime + '</td>' +
                    '<td>' +
                    '<button class="btn btn-sm btn-outline-light me-1" onclick="openEditModal(' + r.id + ')">Edit</button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteResult(' + r.id + ')">Delete</button>' +
                    '</td>' +
                    '</tr>';
            });
        }
        $('#resultsTableBody').html(tbl_body);
    }

    function searchResults() {
        const query = $('#searchInput').val();
        if (query === '') {
            getAllResults();
            return;
        }
        showLoading(true);
        $.ajax({
            url: API + '/search?driverId=' + query,
            type: 'GET',
            dataType: 'json',
            success: function(response) {
                showLoading(false);
                buildTable(response);
            },
            error: function() {
                showLoading(false);
                showToast('Search failed', false);
            }
        });
    }

    function openAddModal() {
        $('#modalTitle').text('Add Result');
        $('#resultId').val('');
        $('#raceId').val('');
        $('#driverId').val('');
        $('#finishingPosition').val('');
        $('#pointsEarned').val('');
        $('#fastestLapTime').val('');
    }

    function openEditModal(id) {
        $.ajax({
            url: API + '/' + id,
            type: 'GET',
            dataType: 'json',
            success: function(r) {
                $('#modalTitle').text('Edit Result');
                $('#resultId').val(r.id);
                $('#raceId').val(r.race ? r.race.id : '');
                $('#driverId').val(r.driver ? r.driver.id : '');
                $('#finishingPosition').val(r.finishingPosition);
                $('#pointsEarned').val(r.pointsEarned);
                $('#fastestLapTime').val(r.fastestLapTime);
                const modal = new bootstrap.Modal(document.getElementById('resultModal'));
                modal.show();
            },
            error: function() {
                showToast('Failed to load result', false);
            }
        });
    }

    function saveResult() {
        const id = $('#resultId').val();
        const body = {
            race: { id: parseInt($('#raceId').val()) },
            driver: { id: parseInt($('#driverId').val()) },
            finishingPosition: parseInt($('#finishingPosition').val()) || 0,
            pointsEarned: parseInt($('#pointsEarned').val()) || 0,
            fastestLapTime: $('#fastestLapTime').val()
        };

        $.ajax({
            url: id ? API + '/' + id : API,
            type: id ? 'PUT' : 'POST',
            contentType: 'application/json',
            data: JSON.stringify(body),
            success: function() {
                bootstrap.Modal.getInstance(document.getElementById('resultModal')).hide();
                getAllResults();
                showToast(id ? 'Result updated successfully!' : 'Result added successfully!', true);
            },
            error: function() {
                showToast('Save failed', false);
            }
        });
    }

    function deleteResult(id) {
        if (!confirm('Are you sure you want to delete this result?')) return;
        $.ajax({
            url: API + '/' + id,
            type: 'DELETE',
            success: function() {
                getAllResults();
                showToast('Result deleted successfully!', true);
            },
            error: function() {
                showToast('Delete failed', false);
            }
        });
    }
</script>
</body>
</html>
