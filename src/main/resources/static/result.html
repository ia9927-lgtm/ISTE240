<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #e8e8e8; }
        h2 { color: #e10600; }
        .table { color: #e8e8e8; }
        .btn-f1 { background: #e10600; border: none; color: #fff; }
        .btn-f1:hover { background: #9a0400; color: #fff; }
        .form-control { background: #1a1a1a; color: #e8e8e8; border-color: #333; }
        .form-control:focus { background: #1a1a1a; color: #e8e8e8; border-color: #e10600; box-shadow: none; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#111; border-bottom:2px solid #e10600;">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" style="color:#e10600;" href="index.html">🏎 F1Stats</a>
        <span class="text-muted">Results</span>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>F1 Results</h2>
        <button class="btn btn-f1" data-bs-toggle="modal" data-bs-target="#resultModal" onclick="openAddModal()">
            + Add Result
        </button>
    </div>

    <div class="mb-3" style="max-width:360px;">
        <input type="text" id="searchInput" class="form-control"
               placeholder="Search by driver, team, or race..." oninput="searchResults()" />
    </div>

    <div id="loadingSpinner" class="text-center my-3" style="display:none;">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-bordered table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Race</th>
                <th>Driver</th>
                <th>Team</th>
                <th>Position</th>
                <th>Points</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="resultsTableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="resultModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="modalTitle">Add Result</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="resultId" />
                <div class="mb-3">
                    <label class="form-label">Race ID</label>
                    <input type="number" id="raceId" class="form-control" placeholder="e.g. 1" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Driver ID</label>
                    <input type="number" id="driverId" class="form-control" placeholder="e.g. 1" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Team ID</label>
                    <input type="number" id="teamId" class="form-control" placeholder="e.g. 1" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Position</label>
                    <input type="number" id="position" class="form-control" min="1" placeholder="e.g. 1" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Points</label>
                    <input type="number" id="points" class="form-control" min="0" step="0.5" placeholder="e.g. 25" />
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-f1" onclick="saveResult()">Save</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api/results';
    let allResults = [];

    $(document).ready(function() {
        getAllResults();
    });

    function showToast(msg, isSuccess) {
        const toastEl = document.getElementById('toast');
        toastEl.classList.remove('bg-success', 'bg-danger');
        toastEl.classList.add(isSuccess ? 'bg-success' : 'bg-danger');
        document.getElementById('toastMsg').textContent = msg;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    function getRaceName(result) {
        return result.race?.grandPrixName || result.raceName || result.grandPrixName || result.raceId || '';
    }

    function getDriverName(result) {
        return result.driver?.name || result.driverName || result.driverId || '';
    }

    function getTeamName(result) {
        return result.team?.name || result.teamName || result.teamId || '';
    }

    function getAllResults() {
        showLoading(true);
        $.ajax({
            url: API,
            type: 'GET',
            dataType: 'json',
            success: function(response) {
                showLoading(false);
                allResults = response;
                buildTable(response);
            },
            error: function() {
                showLoading(false);
                showToast('Failed to load results', false);
            }
        });
    }

    function buildTable(results) {
        let tbl_body = '';
        if (!results || results.length === 0) {
            tbl_body = '<tr><td colspan="7" class="text-center text-muted">No results found</td></tr>';
        } else {
            $.each(results, function(index, r) {
                tbl_body +=
                    '<tr>' +
                    '<td>' + (r.id ?? '') + '</td>' +
                    '<td>' + getRaceName(r) + '</td>' +
                    '<td>' + getDriverName(r) + '</td>' +
                    '<td>' + getTeamName(r) + '</td>' +
                    '<td>' + (r.position ?? '') + '</td>' +
                    '<td>' + (r.points ?? '') + '</td>' +
                    '<td>' +
                    '<button class="btn btn-sm btn-outline-light me-1" onclick="openEditModal(' + r.id + ')">Edit</button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteResult(' + r.id + ')">Delete</button>' +
                    '</td>' +
                    '</tr>';
            });
        }
        $('#resultsTableBody').html(tbl_body);
    }

    function searchResults() {
        const query = $('#searchInput').val().toLowerCase().trim();
        if (query === '') {
            buildTable(allResults);
            return;
        }
        const filtered = allResults.filter(r =>
            String(getRaceName(r)).toLowerCase().includes(query) ||
            String(getDriverName(r)).toLowerCase().includes(query) ||
            String(getTeamName(r)).toLowerCase().includes(query)
        );
        buildTable(filtered);
    }

    function openAddModal() {
        $('#modalTitle').text('Add Result');
        $('#resultId').val('');
        $('#raceId').val('');
        $('#driverId').val('');
        $('#teamId').val('');
        $('#position').val('');
        $('#points').val('');
    }

    function openEditModal(id) {
        $.ajax({
            url: API + '/' + id,
            type: 'GET',
            dataType: 'json',
            success: function(r) {
                $('#modalTitle').text('Edit Result');
                $('#resultId').val(r.id);
                $('#raceId').val(r.raceId || r.race?.id || '');
                $('#driverId').val(r.driverId || r.driver?.id || '');
                $('#teamId').val(r.teamId || r.team?.id || '');
                $('#position').val(r.position);
                $('#points').val(r.points);
                const modal = new bootstrap.Modal(document.getElementById('resultModal'));
                modal.show();
            },
            error: function() {
                showToast('Failed to load result', false);
            }
        });
    }

    function saveResult() {
        const id = $('#resultId').val();
        const body = {
            raceId: parseInt($('#raceId').val()) || null,
            driverId: parseInt($('#driverId').val()) || null,
            teamId: parseInt($('#teamId').val()) || null,
            position: parseInt($('#position').val()) || 0,
            points: parseFloat($('#points').val()) || 0
        };

        $.ajax({
            url: id ? API + '/' + id : API,
            type: id ? 'PUT' : 'POST',
            contentType: 'application/json',
            data: JSON.stringify(body),
            success: function() {
                bootstrap.Modal.getInstance(document.getElementById('resultModal')).hide();
                getAllResults();
                showToast(id ? 'Result updated successfully!' : 'Result added successfully!', true);
            },
            error: function() {
                showToast('Save failed', false);
            }
        });
    }

    function deleteResult(id) {
        if (!confirm('Are you sure you want to delete this result?')) return;
        $.ajax({
            url: API + '/' + id,
            type: 'DELETE',
            success: function() {
                getAllResults();
                showToast('Result deleted successfully!', true);
            },
            error: function() {
                showToast('Delete failed', false);
            }
        });
    }
</script>
</body>
</html>
